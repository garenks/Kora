<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="/img/favicon.png" type="image/x-icon" />
    <title>Kora</title>
  </head>
  <body>
    <div class="page">
      <div class="header">
        <div class="t1">Simulador Financeiro</div>
        <div class="title">Consórcio, financiamento ou empréstimo</div>
        <div class="sub">
          Preencha suas informações e descubra a melhor opção para você!
        </div>
      </div>

      <div class="card">
        <div class="card-title">1. Sobre o valor</div>
        <div class="grid">
          <div class="grid-item">
            <label for="valor">Valor necessário (R$)</label>
            <input type="number" id="valor" placeholder="Ex: 50000" />
          </div>
          <div class="field">
            <label for="finalidade">Finalidade</label>
            <select id="finalidade">
              <option value="veiculo">Veículo</option>
              <option value="casa">Casa</option>
              <option value="outros">Outros</option>
            </select>
          </div>
        </div>

        <div class="card-title">2. Sua situação financeira</div>
        <div class="grid">
          <div class="grid-item">
            <label for="renda">Renda líquida mensal (R$)</label>
            <input type="number" id="renda" placeholder="Ex: 5000" />
          </div>
          <div class="grid-item">
            <label for="reserva">Reserva de emergência (R$)</label>
            <input type="number" id="reserva" placeholder="Ex: 15000" />
          </div>
          <div class="grid-item">
            <label for="prazo">Prazo desejado (meses)</label>
            <input type="number" id="prazo" placeholder="Ex: 60" />
          </div>
        </div>

        <div class="card-title">3. Perfil e urgência</div>
        <div class="grid">
          <div class="field">
            <label for="urgencia">Precisa do dinheiro agora?</label>
            <select id="urgencia">
              <option value="sim">Sim, urgente</option>
              <option value="nao">Não, posso aguardar</option>
            </select>
          </div>

          <div class="field">
            <label for="credito">
              Score de crédito: <span id="score-valor">500</span></label
            >
            <input
              type="range"
              id="credito"
              min="0"
              max="1000"
              value="500"
              oninput="atualizarScore(this.value)"
            />
            <div class="score-faixa faixa-regular" id="score-faixa">
              Regular - aprovação com taxas altas
            </div>
          </div>
        </div>

        <button class="btn-primary" onclick="calcular()">
          Calcular melhor opção
        </button>
      </div>

      <div id="resultado" style="display: none">
        <div class="option-cards" id="opt-cards"></div>
        <div class="card">
          <table id="tabela-resultados"></table>
        </div>
        <div class="pros-grid" id="pros-grid"></div>
        <div class="recom" id="recom-box">
          <div class="recom-title" id="recom-title"></div>
          <div class="recom-body" id="recom-body"></div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
