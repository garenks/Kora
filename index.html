<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Simulador Financeiro</title>
  </head>
  <body>
    <div class="page">
      <div class="header">
        <div class="t1">simulador financeiro</div>
        <div class="title">Consórcio, financiamento ou empréstimo</div>
        <div class="sub">
          Preencha suas informações e descubra a melhor opção para você!
        </div>
      </div>
      <div class="card">
        <div class="card-title">1. Sobre o valor</div>
      </div>

      <div class="grid">
        <div class="grid-item">
          <label for="valor">Valor necessário em (R$):</label>
          <input type="number" id="valor" value="valor" />
        </div>
      </div>
      <div class="field"></div>
    </div>
  </body>
</html>
